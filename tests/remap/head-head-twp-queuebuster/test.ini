[EMC]
VERSION = 1.1

[DISPLAY]
DISPLAY = ./test-ui.py

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = sim.var
SUBROUTINE_PATH = .
USER_M_PATH = .
REMAP = G88.5 modalgroup=1 argspec=pqrl py=twp_move
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.01 G80 G90 G94 G97 M5 M9

[PYTHON]
TOPLEVEL = ./toplevel.py
PATH_PREPEND = .

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[HAL]
HALFILE = core_sim.hal

[TRAJ]
COORDINATES = XYZBC
SPINDLES = 1
NO_FORCE_HOMING = 1
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 100.0
DEFAULT_ANGULAR_VELOCITY = 15.0
MAX_ANGULAR_VELOCITY = 180.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = trivkins coordinates=XYZBC
JOINTS = 5

[AXIS_X]
MIN_LIMIT = 0.0
MAX_LIMIT = 3310.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

[AXIS_Y]
MIN_LIMIT = 0.0
MAX_LIMIT = 1700.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

[AXIS_Z]
MIN_LIMIT = -1200.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 75.0
MAX_ACCELERATION = 500.0

[AXIS_B]
