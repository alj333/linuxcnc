[EMC]
MACHINE = Head-Head 5-Axis Probe Basic Sim
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = probe_basic
TITLE = Head-Head 5-Axis Probe Basic Sim
OPEN_FILE = ./tcp_tcpc_fresh_demo.ngc
CONFIRM_EXIT = False
PREFERENCE_FILE = probe_basic.pref
CONFIG_FILE = custom_config.yml
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
PROGRAM_PREFIX = .
INTRO_GRAPHIC = /home/cnc5/dev/probe_basic/configs/atc_sim/pbsplash.png
INTRO_TIME = 5
EDITOR = gedit
GEOMETRY = XYZBC
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
DEFAULT_SPINDLE_SPEED = 300
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 100.0
MIN_LINEAR_VELOCITY = 0.1
DEFAULT_ANGULAR_VELOCITY = 15.0
MAX_ANGULAR_VELOCITY = 180.0
MIN_ANGULAR_VELOCITY = 1.0
INCREMENTS = JOG 100mm 10mm 1mm .1mm 1deg .1deg .01deg
GEOMETRY = XYZBC
USER_TABS_PATH = user_tabs/
USER_BUTTONS_PATH = /home/cnc5/dev/probe_basic/configs/atc_sim/user_buttons/
USER_DROS_PATH = /home/cnc5/dev/probe_basic/configs/atc_sim/user_dro_display/
DRO_DISPLAY = XYZBC
OFFSET_COLUMNS = XYZBCR
TOOL_TABLE_COLUMNS = TZDR
ATC_TAB_DISPLAY = 1
USER_ATC_BUTTONS_PATH = /home/cnc5/dev/probe_basic/configs/atc_sim/user_atc_buttons/
KEYBOARD_JOG = true
KEYBOARD_JOG_SAFETY_OFF = true
CYCLE_TIME = 100

[KINS]
KINEMATICS = headheadkins coordinates=XYZBC kinstype=B
JOINTS = 5

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-Code File

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = head_head_probe_basic.var
SUBROUTINE_PATH = .:/home/cnc5/dev/probe_basic/configs/probe_basic/subroutines:/home/cnc5/dev/probe_basic/configs/atc_sim/macros_sim
USER_M_PATH = .
REMAP = G43.4 modalgroup=1 py=enable_tcpc_mode
REMAP = G49.1 modalgroup=1 py=disable_tcpc_mode
REMAP = G68.2 modalgroup=1 argspec=bcr py=enable_twp_mode
REMAP = G69 modalgroup=1 py=disable_twp_mode
REMAP = G88.5 modalgroup=1 argspec=pqrl py=twp_move
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.01 G80 G90 G94 G97 M5 M9
ON_ABORT_COMMAND = O<on_abort> CALL

[PYTHON]
PATH_PREPEND = python
TOPLEVEL = python/toplevel.py

[EMCMOT]
EMCMOT = motmod
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 1.0

[ATC]
POCKETS = 12
Z_TOOL_CHANGE_HEIGHT = -100.0
Z_TOOL_CLEARANCE_HEIGHT = 0.0
STEP_TIME = 500

[HAL]
HALFILE = head_head_math_sim.hal
HALFILE = head_head_twp_state.hal
HALFILE = head_head_vismach.hal
HALUI = halui
POSTGUI_HALFILE = probe_basic_postgui.hal
TWOPASS = on

[HALUI]

[TRAJ]
COORDINATES = XYZBC
SPINDLES = 1
NO_FORCE_HOMING = 1
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 100.0
DEFAULT_ANGULAR_VELOCITY = 15.0
MAX_ANGULAR_VELOCITY = 180.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = 0.0
MAX_LIMIT = 3310.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

