# Head-head 5-axis nominal geometry and travel baseline.
# This file is not a full LinuxCNC machine INI. It is a parameter baseline
# for the future kinematics and simulation work.

[MODEL]
NAME = head_head_bc
TOPOLOGY = head_head
ROTARY_ORDER = C_then_B
UNITS = mm
ANGLE_UNITS = deg
CONVENTION = right_hand_standard

[HOME]
X = 0.0
Y = 0.0
Z = 0.0
B = 0.0
C = 0.0

[TRAVEL]
X_MIN = 0.0
X_MAX = 3310.0
Y_MIN = 0.0
Y_MAX = 1700.0
Z_MIN = -900.0
Z_MAX = 0.0
B_MIN = -100.0
B_MAX = 100.0
C_MIN = -360.0
C_MAX = 360.0

[KINEMATIC_CONVENTION]
# Standard right-hand industrial convention for the production machine model.
X_POSITIVE = right
Y_POSITIVE = away_from_operator
Z_POSITIVE = up
B_AXIS_VECTOR = 0,1,0
C_AXIS_VECTOR = 0,0,1
TOOL_VECTOR_AT_ZERO = 0,0,-1

[GEOMETRY_NOMINAL]
# C center to B center nominal offset.
C_TO_B_X = 0.0
C_TO_B_Y = 0.0
C_TO_B_Z = 0.0

# B center to spindle nose reference at B=0, C=0.
# Approximate spindle centerline offset in +Y and nose offset in -Z.
B_TO_SPINDLE_X = 0.0
B_TO_SPINDLE_Y = 25.0
B_TO_SPINDLE_Z = -180.0

[CALIBRATION_DEFAULTS]
# Rotary zero offsets.
B_ZERO_OFFSET = 0.0
C_ZERO_OFFSET = 0.0

# Additional small assembly corrections.
CAL_C_TO_B_X = 0.0
CAL_C_TO_B_Y = 0.0
CAL_C_TO_B_Z = 0.0
CAL_B_TO_SPINDLE_X = 0.0
CAL_B_TO_SPINDLE_Y = 0.0
CAL_B_TO_SPINDLE_Z = 0.0

[CALIBRATION_NOTES]
# Previous physical assembly showed roughly 2 mm spindle center error relative
# to the B axis. Keep all offset terms exposed for real calibration.
PREVIOUS_SPINDLE_CENTER_ERROR_MM = 2.0
