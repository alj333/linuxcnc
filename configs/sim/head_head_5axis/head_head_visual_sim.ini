[EMC]
MACHINE = Head-Head 5-Axis Visual Sim
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
TITLE = Head-Head 5-Axis Visual Sim
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
PROGRAM_PREFIX = .
OPEN_FILE = tcp_test_sequence.ngc
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2
EDITOR = gedit
GEOMETRY = XYZBC
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 100.0
MIN_LINEAR_VELOCITY = 0.1
DEFAULT_ANGULAR_VELOCITY = 15.0
MAX_ANGULAR_VELOCITY = 180.0
MIN_ANGULAR_VELOCITY = 1.0
INCREMENTS = 100mm 10mm 1mm .1mm 1deg .1deg .01deg
CYCLE_TIME = 100

[KINS]
KINEMATICS = headheadkins coordinates=XYZBC kinstype=B
JOINTS = 5

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-Code File

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = head_head_visual_sim.var
SUBROUTINE_PATH = .
USER_M_PATH = .
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.01 G80 G90 G94 G97 M5 M9

[EMCMOT]
EMCMOT = motmod
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 1.0

[HAL]
HALFILE = head_head_math_sim.hal
HALFILE = head_head_twp_state.hal
HALFILE = head_head_vismach.hal
HALUI = halui

[HALUI]

[TRAJ]
COORDINATES = XYZBC
SPINDLES = 1
NO_FORCE_HOMING = 1
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 100.0
DEFAULT_ANGULAR_VELOCITY = 15.0
MAX_ANGULAR_VELOCITY = 180.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = 0.0
MAX_LIMIT = 3310.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

[AXIS_Y]
