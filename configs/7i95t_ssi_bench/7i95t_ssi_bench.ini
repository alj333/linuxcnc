[EMC]
MACHINE = 7i95t_ssi_bench
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.0
MIN_SPINDLE_OVERRIDE = 1.0
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2
PROGRAM_PREFIX = /home/cnc5/linuxcnc-dev/nc_files
INCREMENTS = 10 1 .1 .01
DEFAULT_LINEAR_VELOCITY = 1
MAX_LINEAR_VELOCITY = 1
DEFAULT_ANGULAR_VELOCITY = 10
MAX_ANGULAR_VELOCITY = 60
MIN_ANGULAR_VELOCITY = 0.01
EDITOR = gedit
GEOMETRY = BC
CYCLE_TIME = 100

[RS274NGC]
PARAMETER_FILE = 7i95t_ssi_bench.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HMOT]
CARD0 = hm2_7i95.0

[HAL]
HALFILE = 7i95t_ssi_bench.hal

[KINS]
JOINTS = 2
KINEMATICS = trivkins coordinates=BC

[TRAJ]
NO_FORCE_HOMING = 1
COORDINATES = BC
ANGULAR_UNITS = degree
LINEAR_UNITS = mm
DEFAULT_LINEAR_VELOCITY = 1
MAX_LINEAR_VELOCITY = 1
DEFAULT_ANGULAR_VELOCITY = 10
MAX_ANGULAR_VELOCITY = 60

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[AXIS_B]
MIN_LIMIT = -9999
MAX_LIMIT = 9999
MAX_VELOCITY = 60
MAX_ACCELERATION = 200

[JOINT_0]
TYPE = ANGULAR
HOME = 0.0
FERROR = 100000
MIN_FERROR = 100000
MAX_VELOCITY = 60
MAX_ACCELERATION = 200
MIN_LIMIT = -9999
MAX_LIMIT = 9999
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_SEQUENCE = 0

[AXIS_C]
MIN_LIMIT = -9999
MAX_LIMIT = 9999
MAX_VELOCITY = 60
MAX_ACCELERATION = 200

[JOINT_1]
TYPE = ANGULAR
HOME = 0.0
FERROR = 100000
MIN_FERROR = 100000
MAX_VELOCITY = 60
MAX_ACCELERATION = 200
MIN_LIMIT = -9999
MAX_LIMIT = 9999
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_SEQUENCE = 0
