# Temporary maintenance config for real-machine assembly work.
# X/Y/Z/B/C motion only, with B/C SSI encoders displayed for alignment but not
# used as servo feedback.

[EMC]
MACHINE = 5th_axis_xyzbc_maintenance
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
PREFERENCE_FILE = 5th_axis_xyzbc_maintenance.pref
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 1.000000
MIN_SPINDLE_OVERRIDE = 0.500000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2
PROGRAM_PREFIX = /home/cnc5/linuxcnc/nc_files
INCREMENTS = 10mm 5mm 1mm .5mm .1mm .05mm .01mm
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 25
MIN_LINEAR_VELOCITY = 0.01
DEFAULT_ANGULAR_VELOCITY = 2
MAX_ANGULAR_VELOCITY = 10
MIN_ANGULAR_VELOCITY = 0.01
EDITOR = gedit
GEOMETRY = XYZBC
PYVCP = encoder_alignment.xml
CYCLE_TIME = 100

[RS274NGC]
PARAMETER_FILE = 5th_axis_xyzbc_maintenance.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HMOT]
CARD0 = hm2_7i95.0

[HAL]
HALUI = halui
HALFILE = 5th_axis_xyzbc_maintenance.hal
HALFILE = xhc.hal
POSTGUI_HALFILE = encoder_alignment_postgui.hal
SHUTDOWN = shutdown.hal
TWOPASS = on

[KINS]
JOINTS = 5
KINEMATICS = trivkins coordinates=XYZBC

[TRAJ]
NO_FORCE_HOMING = 1
AXES = 5
COORDINATES = XYZBC
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 25
DEFAULT_ANGULAR_VELOCITY = 2
MAX_ANGULAR_VELOCITY = 10

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = /home/cnc5/linuxcnc-dev/configs/5th_axis_SSI_probe_basic/tool.tbl

