# DIAGNOSTIC ONLY: baseline-correction T3 R2-transfer exploratory attempt 1.
# Derived from the hash-locked task-capture INI. The sole functional addition
# is the observation-only raw/muxed/gated probe edge counter layer. No R2
# candidate overlay is loaded and production/base files remain unchanged.
# Probe Basic calibration config copied from the locked AXIS SSI maintenance
# baseline. Keep machine motion/homing/SSI feedback identical while swapping
# the UI and Probe Basic support layer for probing and calibration work.

[EMC]
MACHINE = 5th_axis_xyzbc_ssi_tcpc_probe_basic
# Diagnostic-only task/interpreter/remap/Python tracing.
DEBUG = 0x4e110
VERSION = 1.1

[DISPLAY]
DISPLAY = probe_basic
TITLE = 5th Axis XYZBC SSI TCPC T3 Exploratory A1
OPEN_FILE = /home/cnc5/dev/probe_basic/example_gcode/blank.ngc
CONFIRM_EXIT = False
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
PREFERENCE_FILE = probe_basic_tcpc.pref
CONFIG_FILE = ../5th_axis_xyzbc_ssi_probe_basic/custom_config.yml
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 1.000000
MIN_SPINDLE_OVERRIDE = 0.500000
INTRO_GRAPHIC = ../5th_axis_xyzbc_ssi_probe_basic/pbsplash.png
INTRO_TIME = 5
PROGRAM_PREFIX = /home/cnc5/mnt/cnc/5th axis
INCREMENTS = JOG 10mm 5mm 1mm .5mm .1mm .05mm .01mm 1deg .1deg .01deg
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 25
MIN_LINEAR_VELOCITY = 0.01
DEFAULT_SPINDLE_SPEED = 300
DEFAULT_ANGULAR_VELOCITY = 2
MAX_ANGULAR_VELOCITY = 8
MIN_ANGULAR_VELOCITY = 0.01
EDITOR = gedit
GEOMETRY = XYZBC
USER_TABS_PATH = user_tabs/
USER_BUTTONS_PATH = user_buttons/
USER_BUTTONS_PATH = ../5th_axis_xyzbc_ssi_probe_basic/user_buttons/
USER_DROS_PATH = ../5th_axis_xyzbc_ssi_probe_basic/user_dro_display/
DRO_DISPLAY = XYZBC
OFFSET_COLUMNS = XYZBCR
TOOL_TABLE_COLUMNS = TZDR
ATC_TAB_DISPLAY = 0
KEYBOARD_JOG = true
KEYBOARD_JOG_SAFETY_OFF = true
CYCLE_TIME = 100

[PYTHON]
TOPLEVEL = ./python/toplevel.py
PATH_PREPEND = ./python/
PATH_APPEND = ../5th_axis_xyzbc_ssi_probe_basic/python/
LOG_LEVEL = 0

[RS274NGC]
SUBROUTINE_PATH = /home/cnc5/linuxcnc-dev/configs/5th_axis_xyzbc_ssi_tcpc_probe_basic/subroutines:/home/cnc5/linuxcnc-dev/configs/5th_axis_xyzbc_ssi_probe_basic/subroutines:/home/cnc5/linuxcnc-dev/configs/5th_axis_xyzbc_ssi_probe_basic/remap_subs
HAL_PIN_VARS = 1
LOG_LEVEL = 2
RS274NGC_STARTUP_CODE = F10 S300 G21 G17 G40 G49 G54 G64 P0.001 G80 G90 G91.1 G92.1 G94 G97 G98
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
# TCPC abort recovery is manual by design. Automatic abort cleanup can hide or
# disturb active TCPC/tool-length state; return B/C to B0 C0, run G49.1, then
# G49 if tool length must be cleared.
# ON_ABORT_COMMAND intentionally unset.
PARAMETER_FILE = 5th_axis_xyzbc_ssi_tcpc_probe_basic.var
REMAP = G43.4 modalgroup=1 py=enable_tcpc_mode
REMAP = G49.1 modalgroup=1 py=disable_tcpc_mode
REMAP = G68.2 modalgroup=1 argspec=xyzijkbcr py=enable_twp_mode
REMAP = G53.1 modalgroup=1 py=activate_twp_mode
REMAP = G69 modalgroup=1 py=disable_twp_mode

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-Code File

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
# Diagnostic launch only: the wrapper changes no task behavior. It records the
# real milltask child PID and final wait status and enables a local core file.
TASK = /home/cnc5/linuxcnc-dev/configs/5th_axis_xyzbc_ssi_tcpc_probe_basic/diagnostics/milltask_exit_capture.sh
CYCLE_TIME = 0.010

[HMOT]
CARD0 = hm2_7i95.0

[HAL]
HALUI = halui
HALFILE = ../5th_axis_xyzbc_ssi_probe_basic/5th_axis_xyzbc_ssi_probe_basic.hal
HALFILE = 5th_axis_xyzbc_ssi_tcpc_probe_basic.hal
HALFILE = tcpc_probe_attempt3_edge_counters.hal
HALFILE = ../5th_axis_xyzbc_ssi_probe_basic/xhc.hal
POSTGUI_HALFILE = 5th_axis_xyzbc_ssi_tcpc_probe_basic_postgui.hal
SHUTDOWN = ../5th_axis_xyzbc_ssi_probe_basic/shutdown.hal
TWOPASS = on

[KINS]
JOINTS = 5
KINEMATICS = headheadkins coordinates=XYZBC kinstype=B

[TRAJ]
NO_FORCE_HOMING = 0
AXES = 5
