[HAL]
HALFILE = LIB:xhc-hb04.tcl

[XHC_HB04_CONFIG]
layout = 2

[XHC_HB04_BUTTONS]
# Keep the fourth selector label because the pendant expects four positions.
# In this maintenance config that extra selector does nothing.
coords = x y z c
coefs = 0.10 0.10 0.10 0.10
scales = 0.2 -0.2 0.2 0.2
jogmode = vnormal
sequence = 1
require_pendant = no
inch_or_mm = mm
mpg_accels = 1 1 2 2

[APPLICATIONS]
APP = monitor-xhc-hb04
