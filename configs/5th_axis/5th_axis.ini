[EMC]
MACHINE = 5th_axis
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = probe_basic
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 2.000000
MIN_SPINDLE_OVERRIDE = 0.500000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
PROGRAM_PREFIX = /home/cnc5/linuxcnc/nc_files
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm .005mm
POSITION_FEEDBACK = ACTUAL
DEFAULT_LINEAR_VELOCITY = 30
MAX_LINEAR_VELOCITY = 400
MIN_LINEAR_VELOCITY = 0.01
DEFAULT_ANGULAR_VELOCITY = 10
MAX_ANGULAR_VELOCITY = 80
MIN_ANGULAR_VELOCITY = 0.01
EDITOR = gedit
GEOMETRY = XYZCBW
CYCLE_TIME = 100
PYVCP = 5th_axis.xml

[PYTHON]
TOPLEVEL = ./python/toplevel.py
PATH_APPEND = ./python/
PATH_APPEND = ./python/python-stdglue/
# the higher the more verbose tracing of the Python plugin
LOG_LEVEL = 0

[RS274NGC]
SUBROUTINE_PATH = ./remap_subs
HAL_PIN_VARS = 1
REMAP = M428  modalgroup=10  ngc=428remap
REMAP = M429  modalgroup=10  ngc=429remap
REMAP = M430  modalgroup=10  ngc=430remap
# YK - M431 remap implemented in python
REMAP = M431  modalgroup=10  python=m431
# YK - M432 remap implemented in python
REMAP = M432  modalgroup=10  python=m432
REMAP = M254 modalgroup=10 argspec=P ngc=dynamic-work-offsets-v2
PARAMETER_FILE = 5axis.var

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HMOT]
# **** This is for info only ****
CARD0=hm2_7i95.0

[HAL]
HALUI = halui
HALFILE = 5th_axis.hal
HALFILE = custom.hal
HALFILE = ToolLengthControl.hal
#POSTGUI_HALFILE = custom_postgui.hal
SHUTDOWN = shutdown.hal
HALFILE = xhc.hal
# YK - HAL variables related to TWP
HALFILE = twp.hal
#HALFILE = LIB:basic_sim.tcl
HALCMD  = net  	:kinstype-select <= motion.analog-out-03 => motion.switchkins-type
HALCMD  = net  	:x-offset      5axiskins.x-offset
HALCMD  = net  	:y-offset      5axiskins.y-offset
#HALCMD  = net  	:pivot-length  
#5axiskins.pivot-length
HALCMD  = sets    :pivot-length  180.15
#HALCMD  = sets    :pivot-length  267.561
# use the short calibration ball
HALCMD  = sets 	:x-offset      0.8625
HALCMD  = sets 	:y-offset      37.595
#  535.198/2 1st measurement
#  535.121/2 1st measurement

