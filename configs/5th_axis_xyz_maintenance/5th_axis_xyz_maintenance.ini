# Temporary maintenance config for real-machine assembly work.
# Intentionally limited to X/Y/Z with no homing required.

[EMC]
MACHINE = 5th_axis_xyz_maintenance
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
PREFERENCE_FILE = 5th_axis_xyz_maintenance.pref
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 1.000000
MIN_SPINDLE_OVERRIDE = 0.500000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2
PROGRAM_PREFIX = /home/cnc5/linuxcnc/nc_files
INCREMENTS = 10mm 5mm 1mm .5mm .1mm .05mm .01mm
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 25
MIN_LINEAR_VELOCITY = 0.01
EDITOR = gedit
GEOMETRY = XYZ
CYCLE_TIME = 100

[RS274NGC]
PARAMETER_FILE = 5th_axis_xyz_maintenance.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HMOT]
CARD0 = hm2_7i95.0

[HAL]
HALUI = halui
HALFILE = 5th_axis_xyz_maintenance.hal
HALFILE = xhc.hal
SHUTDOWN = shutdown.hal
TWOPASS = on

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[TRAJ]
NO_FORCE_HOMING = 1
AXES = 3
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 25

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = /home/cnc5/linuxcnc-dev/configs/5th_axis_SSI_probe_basic/tool.tbl

[AXIS_X]
MAX_VELOCITY = 80
MAX_ACCELERATION = 60
MIN_LIMIT = -1000
MAX_LIMIT = 3350.01

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
FERROR = 100.0
MIN_FERROR = 10.0
MAX_VELOCITY = 80
MAX_ACCELERATION = 60
STEPGEN_MAXVEL = 120
STEPGEN_MAXACCEL = 120
